<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denah Gudang & Alur Operasional — Interaktif</title>
<style>
  :root{
    --navy:#0a2f5c; --navy-deep:#071f3d; --gold:#f2a93c; --gold-dark:#c97f16; --shirt:#2f6fb3; --skin:#e8b98a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy-deep);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#10233f;padding:16px 10px 40px;}
  .wrap{max-width:1000px;margin:0 auto;}
  header{text-align:center;color:#fff;margin-bottom:10px;}
  header h1{font-size:clamp(1.05rem,4vw,1.5rem);margin:0 0 4px;}
  header p{margin:0;color:#a9c1e0;font-size:.82rem;}

  .stage{position:relative; border-radius:14px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.35); background:#dbe6f4;}
  .stage img{display:block; width:100%; height:auto;}

  .hotspot{ position:absolute; cursor:pointer; }
  .ring{
    position:absolute; inset:0; border-radius:10px;
    border:3px solid var(--gold); opacity:0; box-shadow:0 0 0 0 rgba(242,169,60,.6);
    transition:opacity .25s;
  }
  .hotspot:hover .ring{ opacity:.5; }
  .hotspot.active .ring{ opacity:1; animation:pulseRing 1.4s ease-out infinite; }
  @keyframes pulseRing{
    0%{box-shadow:0 0 0 0 rgba(242,169,60,.55);}
    100%{box-shadow:0 0 0 14px rgba(242,169,60,0);}
  }

  .fig{
    position:absolute; width:2.6%; margin-left:-1.3%; margin-top:-1.9%;
    transform-origin:center bottom; pointer-events:none;
    opacity:0; transition:opacity .2s; z-index:5;
  }
  .fig.small{ width:1.7%; margin-left:-0.85%; margin-top:-1.2%; }
  .fig-fork{ width:4%; margin-left:-2%; }
  .fig-truck{ width:2.1%; margin-left:-1.05%; margin-top:-2.9%; }
  .fig-truck-big{ width:3.4%; margin-left:-1.7%; margin-top:-4.6%; }
  .fig.on{ opacity:1; }
  .fig svg{ width:100%; height:auto; display:block; overflow:visible; }

  .p-head{ fill:var(--skin); stroke:#8a5a34; stroke-width:.4; }
  .p-torso{ fill:var(--shirt); stroke:#123a63; stroke-width:.4; }
  .p-leg{ fill:#1c2b46; }
  .p-arm{ fill:var(--shirt); stroke:#123a63; stroke-width:.4; transform-origin:15.5px 11px; }
  .fig.on .p-body{ animation:pBob 1.1s ease-in-out infinite; }
  .fig.on .p-arm{ animation:pArm 1.1s ease-in-out infinite; }
  @keyframes pBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-1.1px);} }
  @keyframes pArm{ 0%,100%{transform:rotate(-22deg);} 50%{transform:rotate(20deg);} }

  .f-body{ fill:var(--gold); stroke:var(--gold-dark); stroke-width:.6; }
  .f-mast{ fill:#333; }
  .f-fork{ fill:#666; }
  .f-wheel{ fill:#222; }
  .fig.on .fig-fork{ animation:forkDrive 2.6s ease-in-out infinite; }
  @keyframes forkDrive{ 0%{transform:translateX(-10px);} 50%{transform:translateX(10px);} 100%{transform:translateX(-10px);} }

  .t-trailer{ fill:#f2f5f9; stroke:#8a97ab; stroke-width:.5; }
  .t-cab{ fill:#c94a3d; stroke:#8a2e24; stroke-width:.5; }
  .t-windshield{ fill:#bfe3ff; }
  .t-wheel{ fill:#111; }
  .fig.on .fig-truck{ animation:truckNudge 2.4s ease-in-out infinite; }
  @keyframes truckNudge{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5%);} }
  .fig.on .fig-truck-big{ animation:truckDrive 3.2s ease-in-out infinite; }
  @keyframes truckDrive{ 0%{transform:translateY(0);} 50%{transform:translateY(-35%);} 100%{transform:translateY(0);} }

  .infobar{
    margin-top:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:12px; padding:14px 16px; min-height:64px; color:#dbe6f5;
  }
  .infobar .title{ color:#fff; font-weight:700; font-size:.95rem; margin-bottom:4px; }
  .infobar .desc{ font-size:.85rem; line-height:1.4; color:#c6d6ee; }
  .infobar .placeholder{ color:#8fa6c8; font-size:.82rem; }

  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .controls.secondary-row{ margin-top:8px; }
  .step-btn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18);
    color:#dbe6f5; border-radius:999px; padding:8px 14px; font-size:.8rem;
    display:flex; align-items:center; gap:8px; cursor:pointer; transition:background .25s,border-color .25s,transform .15s;
  }
  .step-btn .num{width:20px;height:20px;border-radius:50%;background:var(--gold-dark);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .step-btn.selected{ background:rgba(242,169,60,.2); border-color:var(--gold); transform:translateY(-1px); }
  .step-btn.selected .num{ background:var(--gold); color:var(--navy-deep); }

  .toolbar{display:flex;justify-content:center;gap:10px;margin-top:12px;}
  .toolbar button{ background:rgba(255,255,255,.1); color:#dbe6f5; border:none; border-radius:8px; padding:8px 16px; font-size:.82rem; font-weight:600; cursor:pointer; }
  .hint{text-align:center;color:#9fb6d6;font-size:.75rem;margin-top:14px;}

  @media (prefers-reduced-motion: reduce){ .ring, .fig.on .p-body, .fig.on .p-arm, .fig.on .fig-fork, .fig.on .fig-truck, .fig.on .fig-truck-big { animation:none!important; } }
</style>
</head>
